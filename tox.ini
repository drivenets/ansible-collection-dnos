[tox]
requires = 
    tox>=4.0.0
env_list = 
    py{310,311,312}-ansible{2.16,2.17}
    integration
    linters
    units

[testenv]
package = wheel
wheel_build_env = .pkg
extras = 
    test
deps = 
    ansible2.16: ansible-core>=2.16.0,<2.17.0
    ansible2.17: ansible-core>=2.17.0,<2.18.0
    -r{toxinidir}/test-requirements.txt
commands = 
    ansible-test units --venv -v

[testenv:linters]
deps = 
    ansible-lint
    flake8
    isort
    black
    yamllint
    mypy
commands = 
    ansible-lint --version
    ansible-lint
    flake8 plugins
    isort --check-only --diff plugins tests
    black --check --diff plugins tests
    yamllint .
    mypy plugins

[testenv:units]
deps = 
    ansible-core
    pytest
    pytest-ansible
    pytest-cov
    -r{toxinidir}/test-requirements.txt
commands = 
    ansible-test units --coverage -v

[testenv:integration]
deps = 
    ansible-core
    ansible-runner
    pytest
    pytest-ansible
    -r{toxinidir}/test-requirements.txt
commands = 
    ansible-test integration --coverage -v

[testenv:sanity]
deps = 
    ansible-core
commands = 
    ansible-test sanity --requirements

[testenv:coverage-report]
deps = 
    coverage[toml]
depends = 
    units
    integration
commands = 
    coverage combine
    coverage report
    coverage html

# Pre-commit environment for development
[testenv:pre-commit]
deps = 
    pre-commit
commands = 
    pre-commit run --all-files

# Documentation building
[testenv:docs]
deps = 
    sphinx
    sphinx-rtd-theme
    ansible-core
commands = 
    sphinx-build -b html docs docs/_build/html

# Galaxy build and publish
[testenv:galaxy]
deps = 
    ansible-core
commands = 
    ansible-galaxy collection build
    ansible-galaxy collection publish drivenets-dnos-*.tar.gz --token {env:GALAXY_API_TOKEN:}

# flake8 configuration is in .flake8 file

[coverage:run]
source = plugins
omit = 
    */test_*
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines = 
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
